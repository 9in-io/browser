<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>9in browser SDK test</title>
    <link rel="stylesheet" href="styles.css">
    <script src="../dist/9in.min.js"></script>
</head>
<body>

<!--
    Serve the repository root (e.g. `npx serve .`), open /html/test.html, and register
    <origin>/html/test.html as a redirect URL of a single-page application in 9in.
-->

<div class="container">
    <h1>9in - Browser Test</h1>

    <label for="issuer">Issuer</label>
    <input id="issuer" placeholder="https://acme.9in.io">
    <label for="clientId">Client ID</label>
    <input id="clientId" placeholder="app_…">

    <button onclick="auth().login()">Sign in</button>
    <button onclick="auth().signup()">Sign up</button>
    <button onclick="auth().logout({returnTo: location.href.split('?')[0]})">Sign out</button>
</div>

<div class="container">
    <label>Status:</label>
    <div id="statusLabel">Loading...</div>

    <label for="jsonTextbox">User (ID token claims):</label>
    <textarea id="jsonTextbox" readonly></textarea>
</div>

<script>
    for (const id of ['issuer', 'clientId']) {
        const input = document.getElementById(id);
        input.value = localStorage.getItem('9in-test:' + id) || '';
        input.addEventListener('change', () => localStorage.setItem('9in-test:' + id, input.value));
    }

    function auth() {
        return new Nine.NineAuth({
            issuer: document.getElementById('issuer').value,
            clientId: document.getElementById('clientId').value,
            redirectUri: location.origin + location.pathname,
        });
    }

    async function show() {
        const status = document.getElementById('statusLabel');
        try {
            if (new URLSearchParams(location.search).has('code')) await auth().handleRedirect();
            const user = await auth().getUser();
            status.textContent = user ? 'Signed in' : 'Signed out';
            document.getElementById('jsonTextbox').value = JSON.stringify(user, null, 2);
        } catch (error) {
            status.textContent = String(error);
        }
    }

    if (document.getElementById('issuer').value) show(); else document.getElementById('statusLabel').textContent = 'Enter an issuer and client ID.';
</script>
</body>
</html>
